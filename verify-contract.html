<!DOCTYPE html>
<html>
<head>
    <title>Verify Contract Deployment</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #00ff88;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #00ff88; }
        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00ff88;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .error { background: rgba(255, 68, 68, 0.2); border-color: #ff4444; color: #ff4444; }
        .success { background: rgba(0, 255, 136, 0.2); border-color: #00ff88; color: #00ff88; }
        .warning { background: rgba(255, 170, 0, 0.2); border-color: #ffaa00; color: #ffaa00; }
        button {
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { background: #00cc70; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
        input {
            width: 100%;
            padding: 10px;
            background: #2a2a2e;
            border: 2px solid #00ff88;
            color: #00ff88;
            font-family: monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Verify Contract Deployment</h1>

        <div class="section">
            <h2>Contract Address to Check:</h2>
            <input type="text" id="contractAddress" value="0x989092ff3b648df57d54b4a4118f396c8815221e" />
            <button id="verifyBtn" onclick="verifyContract()" disabled>Loading...</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // Load ethers.js first
        let ethersLoaded = false;
        const cdns = [
            'https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js',
            'https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js'
        ];
        let cdnAttempt = 0;

        function loadEthers() {
            const script = document.createElement('script');
            script.src = cdns[cdnAttempt];
            script.onload = function() {
                if (typeof ethers !== 'undefined') {
                    ethersLoaded = true;
                    document.getElementById('verifyBtn').disabled = false;
                    document.getElementById('verifyBtn').textContent = 'Verify Contract';
                    verifyContract(); // Auto-run
                } else if (cdnAttempt < cdns.length - 1) {
                    cdnAttempt++;
                    loadEthers();
                }
            };
            script.onerror = function() {
                if (cdnAttempt < cdns.length - 1) {
                    cdnAttempt++;
                    loadEthers();
                } else {
                    document.getElementById('verifyBtn').textContent = 'Failed to load';
                    addResult('Error', 'Failed to load ethers.js. Please refresh the page.', 'error');
                }
            };
            document.head.appendChild(script);
        }

        loadEthers();

        const RPC_URL = 'https://data-seed-prebsc-1-s1.binance.org:8545/';

        function addResult(title, content, type = 'section') {
            const div = document.createElement('div');
            div.className = `section ${type}`;
            div.innerHTML = `<h2>${title}</h2>${content}`;
            document.getElementById('results').appendChild(div);
        }

        async function verifyContract() {
            document.getElementById('results').innerHTML = '';
            const address = document.getElementById('contractAddress').value.trim();

            if (!ethers.utils.isAddress(address)) {
                addResult('Invalid Address', 'Please enter a valid Ethereum address', 'error');
                return;
            }

            addResult('Checking...', 'Verifying contract deployment...', 'warning');

            const provider = new ethers.providers.JsonRpcProvider(RPC_URL);

            try {
                // 1. Check if address has code
                const code = await provider.getCode(address);
                if (code === '0x') {
                    addResult('❌ No Contract Found',
                        `Address ${address} does not contain a contract!<br>This is either:<br>
                        - An EOA (regular wallet)<br>
                        - A contract that was self-destructed<br>
                        - The wrong address`,
                        'error');
                    return;
                }

                addResult('✅ Contract Exists', `Contract found at ${address}<br>Code size: ${(code.length - 2) / 2} bytes`, 'success');

                // 2. Try to read basic contract info
                const minimalABI = [
                    "function owner() view returns (address)",
                    "function currentRoundId() view returns (uint256)",
                    "function paused() view returns (bool)",
                    "function minParticipants() view returns (uint256)",
                    "function s_vrfCoordinator() view returns (address)",
                    "function blueToken() view returns (address)"
                ];

                const contract = new ethers.Contract(address, minimalABI, provider);

                let results = '<h3>Contract Function Checks:</h3>';
                let failCount = 0;

                // Try each function
                const tests = [
                    { name: 'owner()', func: () => contract.owner() },
                    { name: 'currentRoundId()', func: () => contract.currentRoundId() },
                    { name: 'paused()', func: () => contract.paused() },
                    { name: 'minParticipants()', func: () => contract.minParticipants() },
                    { name: 's_vrfCoordinator()', func: () => contract.s_vrfCoordinator() },
                    { name: 'blueToken()', func: () => contract.blueToken() }
                ];

                for (const test of tests) {
                    try {
                        const result = await test.func();
                        results += `<div style="padding: 5px; margin: 5px 0; background: rgba(0,255,136,0.1); border-left: 3px solid #00ff88;">
                            ✅ ${test.name} = ${result.toString ? result.toString() : result}
                        </div>`;
                    } catch (error) {
                        failCount++;
                        results += `<div style="padding: 5px; margin: 5px 0; background: rgba(255,68,68,0.1); border-left: 3px solid #ff4444;">
                            ❌ ${test.name} FAILED: ${error.message}
                        </div>`;
                    }
                }

                if (failCount > 3) {
                    addResult('❌ Wrong Contract Deployed',
                        results + '<br><strong>This is NOT the BlueRaffle contract!</strong><br>Most functions are failing. You may have deployed the wrong contract or the address is incorrect.',
                        'error');
                } else if (failCount > 0) {
                    addResult('⚠️ Partial Match',
                        results + '<br><strong>Some functions are failing.</strong><br>The contract might be an older version or have ABI issues.',
                        'warning');
                } else {
                    addResult('✅ Contract Verified',
                        results + '<br><strong>All basic functions work!</strong><br>This appears to be a valid BlueRaffle contract.',
                        'success');
                }

                // 3. Check recent deployments from your wallet
                addResult('💡 Tip',
                    `To find your latest deployment:<br>
                    1. Go to <a href="https://testnet.bscscan.com/address/0x5F55f9bBaBe64c4b9070655DEC8DB6519EbdDBf2" target="_blank" style="color: #00d4ff;">your wallet on BscScan</a><br>
                    2. Look for recent "Contract Creation" transactions<br>
                    3. Copy the contract address from the successful deployment<br>
                    4. Paste it above and verify`,
                    'warning');

            } catch (error) {
                addResult('❌ Error', `Error checking contract: ${error.message}<br><pre>${error.stack}</pre>`, 'error');
            }
        }
    </script>
</body>
</html>
