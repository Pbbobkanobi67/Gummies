<!DOCTYPE html>
<html>
<head>
    <title>Blue Raffle - Enhanced Diagnostics & Recovery</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .section h2 {
            color: #53a8ff;
            margin-top: 0;
            border-bottom: 2px solid #0f3460;
            padding-bottom: 10px;
        }
        .status {
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            font-weight: bold;
        }
        .status.pending { background: #f39c12; }
        .status.active { background: #27ae60; }
        .status.waiting { background: #3498db; }
        .status.closed { background: #95a5a6; }
        .error { color: #e74c3c; font-weight: bold; }
        .success { color: #2ecc71; font-weight: bold; }
        .warning { color: #f39c12; font-weight: bold; }
        .info { color: #3498db; }
        button {
            background: #53a8ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #1e90ff;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        button.danger {
            background: #e74c3c;
        }
        button.danger:hover {
            background: #c0392b;
        }
        pre {
            background: #0d1117;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .contract-card {
            background: #0d1117;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #53a8ff;
        }
        .contract-card.stuck {
            border-left-color: #e74c3c;
        }
        .contract-card.fixed {
            border-left-color: #2ecc71;
        }
        .step {
            background: #0d1117;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #f39c12;
        }
        .step-complete {
            border-left-color: #2ecc71;
        }
        a {
            color: #53a8ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>🔍 Blue Raffle - Enhanced Diagnostics & Recovery</h1>

    <div class="section">
        <button onclick="runFullDiagnostics()">🚀 Run Full Diagnostics</button>
        <button onclick="checkBNBBalance()">💰 Check BNB Balance</button>
        <button onclick="showDeploymentGuide()">📋 Show Deployment Guide</button>
    </div>

    <div id="results"></div>

    <script>
        const CONFIG = {
            oldContractAddress: '0x99121F45cB98b38360970e4f7c268da5aD0FFDda',
            newContractAddress: '', // Will be filled in after deployment
            blueTokenAddress: '0xf11Af396703E11D48780B5154E52Fd7b430C6C01',
            adminWallet: '0xa757d90e353b3E045721A41236831238Fc84024F',
            correctSubscriptionId: '43371163114061566586232043748699703279439038188185138377217877577027786652944',
            wrongSubscriptionId: '44140894740336144185324679906066527462467296088040783504114690789879878998902',
            rpcUrl: 'https://data-seed-prebsc-1-s1.binance.org:8545/',
            chainId: 97
        };

        const CONTRACT_ABI = [
            "function currentRoundId() view returns (uint256)",
            "function paused() view returns (bool)",
            "function minParticipants() view returns (uint256)",
            "function roundDuration() view returns (uint256)",
            "function getCurrentRoundInfo() view returns (uint256 roundId, uint256 startTime, uint256 endTime, uint256 prizePool, uint256 totalTickets, uint256 uniqueWallets, uint8 status)",
            "function getRoundParticipants(uint256 roundId) view returns (address[])",
            "function userTickets(uint256 roundId, address user) view returns (uint256)",
            "function subscriptionId() view returns (uint256)"
        ];

        const STATUS_NAMES = ['Pending', 'Active', 'WaitingVRF', 'Closed'];

        async function runFullDiagnostics() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="section"><h2>Running diagnostics...</h2></div>';

            try {
                const provider = new ethers.providers.JsonRpcProvider(CONFIG.rpcUrl);
                let html = '';

                // Check BNB Balance
                html += '<div class="section">';
                html += '<h2>💰 Your BNB Balance</h2>';
                const balance = await provider.getBalance(CONFIG.adminWallet);
                const balanceEth = ethers.utils.formatEther(balance);
                const needsMore = parseFloat(balanceEth) < 0.069;

                html += `<p>Admin Wallet: ${CONFIG.adminWallet}</p>`;
                html += `<p>Balance: <strong>${balanceEth} BNB</strong></p>`;

                if (needsMore) {
                    html += `<p class="error">❌ Insufficient BNB for deployment (need ~0.069 BNB)</p>`;
                    html += `<p class="warning">⚠️ You need ${(0.069 - parseFloat(balanceEth)).toFixed(4)} more BNB</p>`;
                    html += `<p><a href="https://testnet.bnbchain.org/faucet-smart" target="_blank">🚰 Get Free Testnet BNB Here</a></p>`;
                } else {
                    html += `<p class="success">✅ Sufficient BNB for deployment!</p>`;
                }
                html += '</div>';

                // Check Old Contract
                html += '<div class="section">';
                html += '<h2>🔴 OLD CONTRACT (STUCK)</h2>';
                html += '<div class="contract-card stuck">';
                html += `<p><strong>Address:</strong> ${CONFIG.oldContractAddress}</p>`;

                const oldContract = new ethers.Contract(CONFIG.oldContractAddress, CONTRACT_ABI, provider);

                try {
                    const oldSubId = await oldContract.subscriptionId();
                    const oldRoundInfo = await oldContract.getCurrentRoundInfo();
                    const oldPrizePool = ethers.utils.formatEther(oldRoundInfo.prizePool);

                    html += `<p><strong>Subscription ID:</strong> <span class="error">${oldSubId.toString()}</span></p>`;
                    html += `<p class="error">❌ WRONG SUBSCRIPTION ID!</p>`;
                    html += `<p><strong>Round ${oldRoundInfo.roundId}:</strong> ${STATUS_NAMES[oldRoundInfo.status]}</p>`;
                    html += `<p><strong>Prize Pool:</strong> ${oldPrizePool} BLUE</p>`;
                    html += `<p><strong>Participants:</strong> ${oldRoundInfo.uniqueWallets.toString()}</p>`;
                    html += '<hr>';
                    html += '<p class="error"><strong>⚠️ CANNOT BE RECOVERED</strong></p>';
                    html += '<p>This contract has no emergency functions.</p>';
                    html += '<p>The subscription ID is hardcoded and wrong.</p>';
                    html += `<p>Funds stuck: ${oldPrizePool} BLUE (testnet tokens)</p>`;
                } catch (error) {
                    html += `<p class="error">Error reading contract: ${error.message}</p>`;
                }

                html += '</div>';
                html += '</div>';

                // Recovery Plan
                html += '<div class="section">';
                html += '<h2>🛠️ RECOVERY PLAN</h2>';

                html += '<div class="step">';
                html += '<h3>Step 1: Get Testnet BNB</h3>';
                if (needsMore) {
                    html += '<p class="warning">⏳ IN PROGRESS</p>';
                    html += '<ol>';
                    html += '<li>Go to: <a href="https://testnet.bnbchain.org/faucet-smart" target="_blank">BNB Testnet Faucet</a></li>';
                    html += '<li>Connect MetaMask with: ' + CONFIG.adminWallet + '</li>';
                    html += '<li>Click "Give me BNB"</li>';
                    html += '<li>Wait 1-2 minutes</li>';
                    html += '<li>Refresh this page to check balance</li>';
                    html += '</ol>';
                    html += '<button onclick="checkBNBBalance()">🔄 Check Balance Again</button>';
                } else {
                    html += '<p class="success">✅ COMPLETE</p>';
                    html += `<p>You have ${balanceEth} BNB - enough to deploy!</p>`;
                }
                html += '</div>';

                html += '<div class="step' + (needsMore ? '' : ' step-complete') + '">';
                html += '<h3>Step 2: Deploy FIXED Contract</h3>';
                if (needsMore) {
                    html += '<p class="warning">⏸️ WAITING (need more BNB first)</p>';
                } else {
                    html += '<p class="success">✅ READY TO DEPLOY!</p>';
                    html += '<p>Run this command in your project folder:</p>';
                    html += '<pre>npx hardhat run scripts\\deploy.cjs --network bsc_testnet</pre>';
                    html += '<p><strong>What you\'ll get:</strong></p>';
                    html += '<ul>';
                    html += '<li>✅ Correct VRF Subscription ID</li>';
                    html += '<li>✅ Emergency recovery functions</li>';
                    html += '<li>✅ Fixed activation bug</li>';
                    html += '<li>✅ Better diagnostics</li>';
                    html += '</ul>';
                }
                html += '</div>';

                html += '<div class="step">';
                html += '<h3>Step 3: Add to VRF Subscription</h3>';
                html += '<p>⏸️ PENDING (after deployment)</p>';
                html += '<p>After deploying, add the new contract to your VRF subscription:</p>';
                html += '<ol>';
                html += '<li>Go to: <a href="https://vrf.chain.link/bnb-chain-testnet" target="_blank">Chainlink VRF</a></li>';
                html += '<li>Find subscription: ' + CONFIG.correctSubscriptionId.substring(0, 20) + '...</li>';
                html += '<li>Click "Add Consumer"</li>';
                html += '<li>Paste new contract address</li>';
                html += '</ol>';
                html += '</div>';

                html += '<div class="step">';
                html += '<h3>Step 4: Update Frontend & Test</h3>';
                html += '<p>⏸️ PENDING (after deployment)</p>';
                html += '<ol>';
                html += '<li>Update frontend/src/config.js with new address</li>';
                html += '<li>Test buying tickets with 2 wallets</li>';
                html += '<li>Wait 5 minutes and close round</li>';
                html += '<li>Verify winner selection works!</li>';
                html += '</ol>';
                html += '</div>';

                html += '</div>';

                // Summary
                html += '<div class="section">';
                html += '<h2>📊 SUMMARY</h2>';
                html += '<h3 class="error">OLD Contract: ABANDON</h3>';
                html += '<ul>';
                html += '<li>Address: ' + CONFIG.oldContractAddress + '</li>';
                html += '<li>Status: Stuck (wrong VRF subscription)</li>';
                html += '<li>Funds: Cannot be recovered</li>';
                html += '<li>Action: Leave it, deploy new one</li>';
                html += '</ul>';

                html += '<h3 class="success">NEW Contract: DEPLOY</h3>';
                html += '<ul>';
                html += '<li>Will have correct VRF subscription</li>';
                html += '<li>Includes emergency functions</li>';
                html += '<li>Fixed all known bugs</li>';
                if (needsMore) {
                    html += '<li class="warning">Waiting for: ' + (0.069 - parseFloat(balanceEth)).toFixed(4) + ' more BNB</li>';
                } else {
                    html += '<li class="success">Ready to deploy now!</li>';
                }
                html += '</ul>';
                html += '</div>';

                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="section"><h2 class="error">❌ Error</h2><pre>${error.message}</pre></div>`;
            }
        }

        async function checkBNBBalance() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="section"><h2>Checking BNB balance...</h2></div>';

            try {
                const provider = new ethers.providers.JsonRpcProvider(CONFIG.rpcUrl);
                const balance = await provider.getBalance(CONFIG.adminWallet);
                const balanceEth = ethers.utils.formatEther(balance);
                const needsMore = parseFloat(balanceEth) < 0.069;

                let html = '<div class="section">';
                html += '<h2>💰 BNB Balance Check</h2>';
                html += `<p><strong>Wallet:</strong> ${CONFIG.adminWallet}</p>`;
                html += `<p><strong>Balance:</strong> ${balanceEth} BNB</p>`;

                if (needsMore) {
                    html += `<p class="error">❌ Need ${(0.069 - parseFloat(balanceEth)).toFixed(4)} more BNB</p>`;
                    html += '<hr>';
                    html += '<h3>How to Get More BNB:</h3>';
                    html += '<ol>';
                    html += '<li><a href="https://testnet.bnbchain.org/faucet-smart" target="_blank">BNB Chain Faucet</a> - Gives 0.5 BNB</li>';
                    html += '<li><a href="https://faucets.chain.link/bnb-chain-testnet" target="_blank">Chainlink Faucet</a> - Alternative</li>';
                    html += '</ol>';
                    html += '<button onclick="checkBNBBalance()">🔄 Refresh Balance</button>';
                } else {
                    html += '<p class="success">✅ Sufficient BNB for deployment!</p>';
                    html += '<p>You can now deploy the fixed contract:</p>';
                    html += '<pre>npx hardhat run scripts\\deploy.cjs --network bsc_testnet</pre>';
                }
                html += '</div>';

                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="section"><h2 class="error">❌ Error</h2><pre>${error.message}</pre></div>`;
            }
        }

        function showDeploymentGuide() {
            const html = `
            <div class="section">
                <h2>📋 Complete Deployment Guide</h2>

                <h3>Prerequisites:</h3>
                <ul>
                    <li>At least 0.069 BNB in wallet (get from faucet)</li>
                    <li>BlueRaffle_FIXED.sol in your project</li>
                    <li>deploy-fixed-contract.js script ready</li>
                    <li>.env file with correct subscription ID</li>
                </ul>

                <h3>Step-by-Step:</h3>

                <h4>1. Verify .env File</h4>
                <p>Make sure your .env contains:</p>
                <pre>VRF_SUBSCRIPTION_ID=${CONFIG.correctSubscriptionId}</pre>

                <h4>2. Run Deployment</h4>
                <pre>cd C:\\Users\\bob\\Blue-Raffle
npx hardhat run scripts\\deploy.cjs --network bsc_testnet</pre>

                <h4>3. After Deployment</h4>
                <ul>
                    <li>Copy the new contract address</li>
                    <li>Add to VRF subscription at: <a href="https://vrf.chain.link/bnb-chain-testnet" target="_blank">vrf.chain.link</a></li>
                    <li>Update frontend config.js</li>
                    <li>Test the full flow!</li>
                </ul>

                <h3>Common Issues:</h3>
                <ul>
                    <li><strong>Insufficient funds:</strong> Get more BNB from faucet</li>
                    <li><strong>Wrong subscription ID:</strong> Check .env file</li>
                    <li><strong>Compilation error:</strong> Make sure BlueRaffle_FIXED.sol is in contracts folder</li>
                </ul>

                <button onclick="runFullDiagnostics()">🔙 Back to Diagnostics</button>
            </div>
            `;

            document.getElementById('results').innerHTML = html;
        }

        // Auto-run on load
        window.onload = runFullDiagnostics;
    </script>
</body>
</html>
