<!DOCTYPE html>
<html>
<head>
    <title>Blue Raffle Diagnostics</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .section {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .section h2 {
            color: #53a8ff;
            margin-top: 0;
            border-bottom: 2px solid #0f3460;
            padding-bottom: 10px;
        }
        .status {
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            font-weight: bold;
        }
        .status.pending { background: #f39c12; }
        .status.active { background: #27ae60; }
        .status.waiting { background: #3498db; }
        .status.closed { background: #95a5a6; }
        .error { color: #e74c3c; font-weight: bold; }
        .success { color: #2ecc71; font-weight: bold; }
        .warning { color: #f39c12; font-weight: bold; }
        .info { color: #3498db; }
        button {
            background: #53a8ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background: #1e90ff;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        pre {
            background: #0d1117;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .participant {
            background: #0d1117;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🔍 Blue Raffle Diagnostic Tool</h1>

    <div class="section">
        <button id="runDiagnostics" onclick="runDiagnostics()">🚀 Run Full Diagnostics</button>
        <button onclick="testUnpause()" style="margin-left: 10px;">🔓 Test Unpause (Owner Only)</button>
    </div>

    <div id="results"></div>

    <script>
        const CONFIG = {
            contractAddress: '0x99121F45cB98b38360970e4f7c268da5aD0FFDda',
            blueTokenAddress: '0xf11Af396703E11D48780B5154E52Fd7b430C6C01',
            adminWallet: '0xa757d90e353b3E045721A41236831238Fc84024F',
            rpcUrl: 'https://data-seed-prebsc-1-s1.binance.org:8545/',
            chainId: 97 // BNB Testnet
        };

        const CONTRACT_ABI = [
            "function currentRoundId() view returns (uint256)",
            "function paused() view returns (bool)",
            "function minParticipants() view returns (uint256)",
            "function roundDuration() view returns (uint256)",
            "function minTickets() view returns (uint256)",
            "function maxTickets() view returns (uint256)",
            "function getCurrentRoundInfo() view returns (uint256 roundId, uint256 startTime, uint256 endTime, uint256 prizePool, uint256 totalTickets, uint256 uniqueWallets, uint8 status)",
            "function getRoundParticipants(uint256 roundId) view returns (address[])",
            "function userTickets(uint256 roundId, address user) view returns (uint256)",
            "function canCloseRound() view returns (bool, uint256, string)",
            "function closeRound()",
            "function unpause()"
        ];

        const STATUS_NAMES = ['Pending', 'Active', 'WaitingVRF', 'Closed'];

        async function runDiagnostics() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="section"><h2>Running diagnostics...</h2></div>';

            try {
                // Connect to BNB Testnet
                const provider = new ethers.providers.JsonRpcProvider(CONFIG.rpcUrl);
                const contract = new ethers.Contract(CONFIG.contractAddress, CONTRACT_ABI, provider);

                let html = '';

                // Get current block time
                const block = await provider.getBlock('latest');
                const currentTime = block.timestamp;

                html += `<div class="section">`;
                html += `<h2>📡 Network Info</h2>`;
                html += `<p>Block Number: ${block.number}</p>`;
                html += `<p>Current Time: ${new Date(currentTime * 1000).toLocaleString()}</p>`;
                html += `</div>`;

                // Get contract configuration
                html += `<div class="section">`;
                html += `<h2>⚙️ Contract Configuration</h2>`;

                const isPaused = await contract.paused();
                const minParticipants = await contract.minParticipants();
                const roundDuration = await contract.roundDuration();
                const minTickets = await contract.minTickets();
                const maxTickets = await contract.maxTickets();

                html += `<p>Contract Paused: ${isPaused ? '<span class="error">🔴 YES - THIS IS THE PROBLEM!</span>' : '<span class="success">🟢 NO</span>'}</p>`;
                html += `<p>Min Participants: ${minParticipants.toString()}</p>`;
                html += `<p>Round Duration: ${roundDuration.toString()}s (${roundDuration / 60} minutes)</p>`;
                html += `<p>Min Tickets: ${ethers.utils.formatEther(minTickets)} BLUE</p>`;
                html += `<p>Max Tickets: ${ethers.utils.formatEther(maxTickets)} BLUE</p>`;
                html += `</div>`;

                // Get current round info
                html += `<div class="section">`;
                html += `<h2>🎰 Current Round Status</h2>`;

                const roundInfo = await contract.getCurrentRoundInfo();
                const roundId = roundInfo.roundId;
                const startTime = roundInfo.startTime;
                const endTime = roundInfo.endTime;
                const prizePool = roundInfo.prizePool;
                const totalTickets = roundInfo.totalTickets;
                const uniqueWallets = roundInfo.uniqueWallets;
                const status = roundInfo.status;

                html += `<p>Round ID: ${roundId.toString()}</p>`;
                html += `<p>Status: <span class="status ${STATUS_NAMES[status].toLowerCase()}">${STATUS_NAMES[status]}</span></p>`;
                html += `<p>Unique Participants: ${uniqueWallets.toString()}</p>`;
                html += `<p>Total Tickets: ${ethers.utils.formatEther(totalTickets)} BLUE</p>`;
                html += `<p>Prize Pool: ${ethers.utils.formatEther(prizePool)} BLUE</p>`;

                if (startTime.gt(0)) {
                    html += `<p>Start Time: ${new Date(startTime * 1000).toLocaleString()}</p>`;
                    html += `<p>End Time: ${new Date(endTime * 1000).toLocaleString()}</p>`;
                    const timeLeft = endTime.toNumber() - currentTime;
                    if (timeLeft > 0) {
                        html += `<p>Time Remaining: ${Math.floor(timeLeft / 60)} minutes ${timeLeft % 60} seconds</p>`;
                    } else {
                        html += `<p class="warning">Time Remaining: ⏰ EXPIRED (${Math.abs(Math.floor(timeLeft / 60))} minutes ago)</p>`;
                    }
                } else {
                    html += `<p class="info">Start Time: Not started yet (Pending status)</p>`;
                }
                html += `</div>`;

                // Get participants
                html += `<div class="section">`;
                html += `<h2>👥 Participants</h2>`;

                const participants = await contract.getRoundParticipants(roundId);
                html += `<p>Total: ${participants.length}</p>`;

                for (let i = 0; i < participants.length; i++) {
                    const addr = participants[i];
                    const tickets = await contract.userTickets(roundId, addr);
                    html += `<div class="participant">`;
                    html += `<strong>${i + 1}. ${addr}</strong><br>`;
                    html += `Tickets: ${ethers.utils.formatEther(tickets)} BLUE`;
                    html += `</div>`;
                }
                html += `</div>`;

                // Check if can close
                html += `<div class="section">`;
                html += `<h2>🔒 Close Round Check</h2>`;

                try {
                    const canClose = await contract.canCloseRound();
                    html += `<p>Can Close: ${canClose[0] ? '<span class="success">✅ YES</span>' : '<span class="error">❌ NO</span>'}</p>`;
                    html += `<p>Close Reward: ${ethers.utils.formatEther(canClose[1])} BLUE</p>`;
                    html += `<p>Message: ${canClose[2]}</p>`;
                } catch (error) {
                    html += `<p class="error">❌ Error checking canCloseRound: ${error.message}</p>`;
                }
                html += `</div>`;

                // Diagnosis
                html += `<div class="section">`;
                html += `<h2>🔬 DIAGNOSIS</h2>`;

                if (isPaused) {
                    html += `<p class="error">❌ ISSUE FOUND: Contract is PAUSED</p>`;
                    html += `<p class="warning">⚠️ closeRound() doesn't have whenNotPaused modifier, but it still might be causing issues</p>`;
                    html += `<p><strong>Solution:</strong> Call unpause() from owner wallet (${CONFIG.adminWallet})</p>`;
                    html += `<button onclick="testUnpause()">🔓 Unpause Contract</button>`;
                }

                if (status === 0) { // Pending
                    html += `<p class="error">⚠️ ISSUE: Round is in PENDING status</p>`;
                    html += `<p>Current participants: ${uniqueWallets.toString()}</p>`;
                    html += `<p>Required: ${minParticipants.toString()}</p>`;
                    if (uniqueWallets.lt(minParticipants)) {
                        html += `<p class="error">❌ Need ${minParticipants.sub(uniqueWallets).toString()} more participant(s)</p>`;
                    } else {
                        html += `<p class="warning">⚠️ Has enough participants but still PENDING</p>`;
                        html += `<p class="error">This is the HARDCODED BUG: Line 95-100 checks >= 2 instead of >= minParticipants</p>`;
                        html += `<p>If minParticipants was changed from 2 to 3 after deployment, the round won't activate properly</p>`;
                    }
                }

                if (status === 1) { // Active
                    if (currentTime < endTime.toNumber()) {
                        html += `<p class="info">⏰ Round is ACTIVE but not ready to close yet</p>`;
                        const remaining = endTime.toNumber() - currentTime;
                        html += `<p>Time remaining: ${Math.floor(remaining / 60)} minutes</p>`;
                    } else {
                        html += `<p class="success">✅ Round is ready to close!</p>`;
                        if (isPaused) {
                            html += `<p class="error">❌ But contract is PAUSED - unpause first!</p>`;
                        }
                    }
                }

                if (status === 2) { // WaitingVRF
                    html += `<p class="info">⏳ Round is waiting for VRF response</p>`;
                    html += `<p>Check Chainlink VRF subscription status</p>`;
                }

                html += `</div>`;

                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = `<div class="section"><h2 class="error">❌ Error</h2><pre>${error.message}</pre></div>`;
            }
        }

        async function testUnpause() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    alert('MetaMask not detected!');
                    return;
                }

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const contract = new ethers.Contract(CONFIG.contractAddress, CONTRACT_ABI, signer);

                alert('Sending unpause transaction...');
                const tx = await contract.unpause();
                alert('Transaction sent! Hash: ' + tx.hash + '\nWaiting for confirmation...');
                await tx.wait();
                alert('✅ Contract unpaused successfully!');

                // Re-run diagnostics
                await runDiagnostics();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // Auto-run on load
        window.onload = runDiagnostics;
    </script>
</body>
</html>
