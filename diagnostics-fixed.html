<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Raffle - Full Diagnostics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #00ff88;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff88;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .section h2 { color: #00d4ff; margin-bottom: 15px; font-size: 1.5em; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }
        .info-label { font-weight: bold; color: #00d4ff; }
        .info-value { color: #00ff88; text-align: right; }
        .status-good { color: #00ff88; font-weight: bold; }
        .status-warning { color: #ffaa00; font-weight: bold; }
        .status-error { color: #ff4444; font-weight: bold; }
        button {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.5);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .button-group { text-align: center; margin: 20px 0; }
        .loading {
            text-align: center;
            font-size: 1.5em;
            color: #00d4ff;
            margin: 20px 0;
        }
        .error-box {
            background: rgba(255, 68, 68, 0.2);
            border: 2px solid #ff4444;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            color: #ff4444;
        }
        .success-box {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            color: #00ff88;
        }
        .warning-box {
            background: rgba(255, 170, 0, 0.2);
            border: 2px solid #ffaa00;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            color: #ffaa00;
        }
        .participants-list { margin-top: 10px; }
        .participant-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
        }
        .checklist { margin-top: 10px; }
        .checklist-item { padding: 8px; margin: 5px 0; border-radius: 3px; }
        .check-pass { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .check-fail { background: rgba(255, 68, 68, 0.1); color: #ff4444; }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            color: #00ff88;
            font-size: 0.9em;
        }
        .timestamp {
            text-align: center;
            color: #888;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .countdown {
            font-size: 2em;
            text-align: center;
            margin: 20px 0;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
        }
        #init-status {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Blue Raffle - Full System Diagnostics</h1>

        <div id="init-status">⏳ Loading ethers.js library...</div>

        <div class="button-group" id="buttons" style="display: none;">
            <button onclick="runFullDiagnostics()">🔍 Run Full Diagnostics</button>
            <button onclick="checkVRFSetup()">🔗 Check VRF Setup</button>
            <button onclick="testCloseRound()">🎲 Test Close Round</button>
        </div>

        <div id="results"></div>
        <div class="timestamp" id="timestamp"></div>
    </div>

    <!-- Try multiple CDN sources for ethers.js -->
    <script>
        // Show loading indicator
        let ethersLoadAttempts = 0;
        const maxAttempts = 3;

        function loadEthersScript(url, callback) {
            const script = document.createElement('script');
            script.src = url;
            script.onload = callback;
            script.onerror = () => {
                console.error('Failed to load from:', url);
                ethersLoadAttempts++;
                if (ethersLoadAttempts < maxAttempts) {
                    tryLoadEthers();
                } else {
                    document.getElementById('init-status').innerHTML =
                        '<div class="error-box">❌ Failed to load ethers.js from all sources. Please check your internet connection and refresh the page.</div>';
                }
            };
            document.head.appendChild(script);
        }

        function tryLoadEthers() {
            const cdns = [
                'https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js',
                'https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js'
            ];

            loadEthersScript(cdns[ethersLoadAttempts], initializeApp);
        }

        function initializeApp() {
            if (typeof ethers === 'undefined') {
                console.error('Ethers still not loaded');
                ethersLoadAttempts++;
                if (ethersLoadAttempts < maxAttempts) {
                    tryLoadEthers();
                }
                return;
            }

            document.getElementById('init-status').innerHTML =
                '<div class="success-box">✅ Ethers.js loaded successfully!</div>';

            setTimeout(() => {
                document.getElementById('init-status').style.display = 'none';
                document.getElementById('buttons').style.display = 'block';
                runFullDiagnostics();
            }, 1000);
        }

        // Start loading ethers
        tryLoadEthers();
    </script>

    <script>
        const CONFIG = {
            contractAddress: '0x989092ff3b648df57d54b4a4118f396c8815221e',
            blueTokenAddress: '0xf11Af396703E11D48780B5154E52Fd7b430C6C01',
            vrfCoordinator: '0xDA3b641D438362C440Ac5458c57e00a712b66700',
            subscriptionId: '26655927599451290729520880429262733726305991805472180956508373717196718435172',
            keyHash: '0x8596b430971ac45bdf6088665b9ad8e8630c9d5049ab54b14dff711bee7c0e26',
            rpcUrl: 'https://data-seed-prebsc-1-s1.binance.org:8545/',
            chainId: 97
        };

        const CONTRACT_ABI = [
            "function currentRoundId() view returns (uint256)",
            "function paused() view returns (bool)",
            "function owner() view returns (address)",
            "function minParticipants() view returns (uint256)",
            "function roundDuration() view returns (uint256)",
            "function rounds(uint256) view returns (uint256 totalPot, uint256 prizePool, uint256 uniqueWallets, uint256 totalTickets, uint256 startTime, uint256 endTime, uint8 status, address winner)",
            "function canCloseRound() view returns (bool, string memory)",
            "function closeRound()",
            "function getRoundParticipants(uint256) view returns (address[] memory)",
            "function getParticipantTickets(uint256, address) view returns (uint256)",
            "function getDiagnostics() view returns (uint256, uint8, uint256, uint256, uint256, uint256, uint256, bool, address, uint256, uint256)",
            "function s_vrfCoordinator() view returns (address)",
            "function s_subscriptionId() view returns (uint64)",
            "function s_gasLane() view returns (bytes32)",
            "function s_callbackGasLimit() view returns (uint32)",
            "function blueToken() view returns (address)",
            "function treasuryWallet() view returns (address)",
            "function developerWallet() view returns (address)"
        ];

        const VRF_ABI = [
            "function getSubscription(uint64 subId) view returns (uint96 balance, uint64 reqCount, address owner, address[] memory consumers)"
        ];

        const STATUS_NAMES = ['Pending', 'Active', 'WaitingVRF', 'Completed'];

        let provider, contract, vrfContract;

        function updateTimestamp() {
            document.getElementById('timestamp').textContent = 'Last updated: ' + new Date().toLocaleString();
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            updateTimestamp();
        }

        function addSection(title, content, status = '') {
            const section = document.createElement('div');
            section.className = 'section';
            let statusIcon = '';
            if (status === 'good') statusIcon = '✅';
            else if (status === 'warning') statusIcon = '⚠️';
            else if (status === 'error') statusIcon = '❌';
            section.innerHTML = `<h2>${statusIcon} ${title}</h2>${content}`;
            document.getElementById('results').appendChild(section);
        }

        function addLoading(message) {
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = `🔄 ${message}`;
            document.getElementById('results').appendChild(loading);
        }

        async function init() {
            try {
                if (typeof ethers === 'undefined') {
                    throw new Error('Ethers.js not loaded yet');
                }
                provider = new ethers.providers.JsonRpcProvider(CONFIG.rpcUrl);
                contract = new ethers.Contract(CONFIG.contractAddress, CONTRACT_ABI, provider);
                vrfContract = new ethers.Contract(CONFIG.vrfCoordinator, VRF_ABI, provider);
                return true;
            } catch (error) {
                addSection('Initialization Error',
                    `<div class="error-box">Failed to initialize: ${error.message}</div>`,
                    'error');
                return false;
            }
        }

        async function runFullDiagnostics() {
            clearResults();
            addLoading('Running comprehensive diagnostics...');

            if (!await init()) return;

            try {
                await checkContractConfiguration();
                await checkCurrentRound();
                await checkVRFConfiguration();
                await checkCloseRoundReadiness();
                await checkParticipants();
                await checkContractBalance();
                document.querySelector('.loading')?.remove();
            } catch (error) {
                document.querySelector('.loading')?.remove();
                addSection('Diagnostic Error',
                    `<div class="error-box">Error: ${error.message}<br><pre>${error.stack}</pre></div>`,
                    'error');
            }
        }

        async function checkContractConfiguration() {
            try {
                const [owner, paused, minParticipants, roundDuration, blueToken, treasuryWallet, developerWallet] = await Promise.all([
                    contract.owner(), contract.paused(), contract.minParticipants(), contract.roundDuration(),
                    contract.blueToken(), contract.treasuryWallet(), contract.developerWallet()
                ]);

                let status = 'good';
                let issues = [];
                if (paused) {
                    status = 'error';
                    issues.push('<div class="error-box">⚠️ CONTRACT IS PAUSED - Must unpause!</div>');
                }

                const content = `
                    ${issues.join('')}
                    <div class="info-row"><span class="info-label">Contract:</span><span class="info-value">${CONFIG.contractAddress}</span></div>
                    <div class="info-row"><span class="info-label">Owner:</span><span class="info-value">${owner}</span></div>
                    <div class="info-row"><span class="info-label">Paused:</span><span class="info-value ${paused ? 'status-error' : 'status-good'}">${paused ? 'YES ❌' : 'NO ✅'}</span></div>
                    <div class="info-row"><span class="info-label">Min Participants:</span><span class="info-value">${minParticipants}</span></div>
                    <div class="info-row"><span class="info-label">Round Duration:</span><span class="info-value">${roundDuration}s (${Math.floor(roundDuration / 60)} min)</span></div>
                `;
                addSection('Contract Configuration', content, status);
            } catch (error) {
                addSection('Contract Configuration', `<div class="error-box">Error: ${error.message}</div>`, 'error');
            }
        }

        async function checkCurrentRound() {
            try {
                const currentRoundId = await contract.currentRoundId();
                if (currentRoundId.eq(0)) {
                    addSection('Current Round', '<div class="warning-box">No rounds exist yet.</div>', 'warning');
                    return;
                }

                const round = await contract.rounds(currentRoundId);
                const now = Math.floor(Date.now() / 1000);
                const timeLeft = round.endTime.toNumber() - now;

                let statusClass = 'good';
                let statusText = STATUS_NAMES[round.status];
                if (round.status === 0) { statusClass = 'warning'; statusText += ' ⚠️ (Needs Active)'; }
                else if (round.status === 1 && timeLeft <= 0) { statusClass = 'good'; statusText += ' ✅ (Ready!)'; }
                else if (round.status === 2) { statusClass = 'warning'; statusText += ' ⏳ (Waiting VRF)'; }

                let timerDisplay = '';
                if (round.status === 1) {
                    timerDisplay = timeLeft > 0
                        ? `<div class="countdown">⏰ ${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2,'0')}</div>`
                        : `<div class="countdown status-good">⏰ EXPIRED - READY TO CLOSE!</div>`;
                }

                const content = `
                    ${timerDisplay}
                    <div class="info-row"><span class="info-label">Round ID:</span><span class="info-value">${currentRoundId}</span></div>
                    <div class="info-row"><span class="info-label">Status:</span><span class="info-value status-${statusClass}">${statusText}</span></div>
                    <div class="info-row"><span class="info-label">Total Pot:</span><span class="info-value">${ethers.utils.formatEther(round.totalPot)} BLUE</span></div>
                    <div class="info-row"><span class="info-label">Participants:</span><span class="info-value">${round.uniqueWallets}</span></div>
                    <div class="info-row"><span class="info-label">Total Tickets:</span><span class="info-value">${round.totalTickets}</span></div>
                    <div class="info-row"><span class="info-label">Time Left:</span><span class="info-value ${timeLeft <= 0 ? 'status-good' : ''}">${timeLeft <= 0 ? 'EXPIRED ✅' : timeLeft + 's'}</span></div>
                `;
                addSection('Current Round Status', content, statusClass);
            } catch (error) {
                addSection('Current Round', `<div class="error-box">Error: ${error.message}</div>`, 'error');
            }
        }

        async function checkVRFConfiguration() {
            try {
                const [vrfCoordinator, subscriptionId, keyHash, callbackGasLimit] = await Promise.all([
                    contract.s_vrfCoordinator(), contract.s_subscriptionId(),
                    contract.s_gasLane(), contract.s_callbackGasLimit()
                ]);

                let status = 'good';
                let issues = [];

                if (vrfCoordinator.toLowerCase() !== CONFIG.vrfCoordinator.toLowerCase()) {
                    status = 'error';
                    issues.push(`<div class="error-box">❌ VRF Coordinator mismatch!</div>`);
                }
                if (keyHash.toLowerCase() !== CONFIG.keyHash.toLowerCase()) {
                    status = 'error';
                    issues.push(`<div class="error-box">❌ Key Hash mismatch!</div>`);
                }

                const content = `
                    ${issues.join('')}
                    ${issues.length === 0 ? '<div class="success-box">✅ VRF params OK!</div>' : ''}
                    <div class="info-row"><span class="info-label">VRF Coordinator:</span><span class="info-value">${vrfCoordinator}</span></div>
                    <div class="info-row"><span class="info-label">Subscription ID:</span><span class="info-value">${subscriptionId}</span></div>
                    <div class="info-row"><span class="info-label">Key Hash:</span><span class="info-value">${keyHash}</span></div>
                    <div class="info-row"><span class="info-label">Gas Limit:</span><span class="info-value">${callbackGasLimit}</span></div>
                `;
                addSection('VRF Configuration', content, status);
                await checkVRFSubscription(subscriptionId);
            } catch (error) {
                addSection('VRF Configuration', `<div class="error-box">Error: ${error.message}</div>`, 'error');
            }
        }

        async function checkVRFSubscription(subscriptionId) {
            try {
                const subscription = await vrfContract.getSubscription(subscriptionId);
                const linkBalance = ethers.utils.formatEther(subscription.balance);
                const consumers = subscription.consumers;

                let status = 'good';
                let issues = [];

                if (parseFloat(linkBalance) < 0.1) {
                    status = 'error';
                    issues.push('<div class="error-box">❌ Low LINK balance!</div>');
                }

                const isConsumer = consumers.some(c => c.toLowerCase() === CONFIG.contractAddress.toLowerCase());
                if (!isConsumer) {
                    status = 'error';
                    issues.push('<div class="error-box">❌❌❌ CONTRACT NOT REGISTERED AS CONSUMER! This is why closeRound() fails! ❌❌❌</div>');
                }

                const consumersList = consumers.map((c, i) =>
                    `<div class="participant-item">${i + 1}. ${c} ${c.toLowerCase() === CONFIG.contractAddress.toLowerCase() ? '✅ THIS CONTRACT' : ''}</div>`
                ).join('');

                const content = `
                    ${issues.join('')}
                    ${issues.length === 0 ? '<div class="success-box">✅ VRF Subscription OK!</div>' : ''}
                    <div class="info-row"><span class="info-label">LINK Balance:</span><span class="info-value ${parseFloat(linkBalance) < 0.5 ? 'status-warning' : 'status-good'}">${linkBalance} LINK</span></div>
                    <div class="info-row"><span class="info-label">Request Count:</span><span class="info-value">${subscription.reqCount}</span></div>
                    <div class="info-row"><span class="info-label">Owner:</span><span class="info-value">${subscription.owner}</span></div>
                    <div class="info-row"><span class="info-label">Is Consumer:</span><span class="info-value ${isConsumer ? 'status-good' : 'status-error'}">${isConsumer ? 'YES ✅' : 'NO ❌'}</span></div>
                    <div style="margin-top: 15px;"><strong>Registered Consumers:</strong><div class="participants-list">${consumersList}</div></div>
                `;
                addSection('VRF Subscription Details', content, status);
            } catch (error) {
                addSection('VRF Subscription', `<div class="error-box">Error: ${error.message}</div>`, 'error');
            }
        }

        async function checkCloseRoundReadiness() {
            try {
                const currentRoundId = await contract.currentRoundId();
                if (currentRoundId.eq(0)) return;

                const [canCloseResult, paused, minParticipants, round] = await Promise.all([
                    contract.canCloseRound().catch(() => [false, "N/A"]),
                    contract.paused(), contract.minParticipants(), contract.rounds(currentRoundId)
                ]);

                const now = Math.floor(Date.now() / 1000);
                const timeLeft = round.endTime.toNumber() - now;
                const checks = [];
                let allPass = true;

                if (!paused) checks.push('<div class="checklist-item check-pass">✅ Not paused</div>');
                else { checks.push('<div class="checklist-item check-fail">❌ PAUSED</div>'); allPass = false; }

                if (round.status === 1) checks.push('<div class="checklist-item check-pass">✅ Active</div>');
                else { checks.push(`<div class="checklist-item check-fail">❌ ${STATUS_NAMES[round.status]}</div>`); allPass = false; }

                if (timeLeft <= 0) checks.push('<div class="checklist-item check-pass">✅ Time expired</div>');
                else { checks.push(`<div class="checklist-item check-fail">❌ ${timeLeft}s left</div>`); allPass = false; }

                if (round.uniqueWallets >= minParticipants) checks.push(`<div class="checklist-item check-pass">✅ Participants (${round.uniqueWallets}/${minParticipants})</div>`);
                else { checks.push(`<div class="checklist-item check-fail">❌ Participants (${round.uniqueWallets}/${minParticipants})</div>`); allPass = false; }

                if (canCloseResult[0]) checks.push('<div class="checklist-item check-pass">✅ Contract ready</div>');
                else { checks.push(`<div class="checklist-item check-fail">❌ ${canCloseResult[1]}</div>`); allPass = false; }

                const status = allPass ? 'good' : 'error';
                const summary = allPass ? '<div class="success-box">🎉 READY TO CLOSE!</div>' : '<div class="error-box">⚠️ Not ready</div>';
                const content = `${summary}<div class="checklist">${checks.join('')}</div>`;
                addSection('Close Round Readiness', content, status);
            } catch (error) {
                addSection('Readiness', `<div class="error-box">Error: ${error.message}</div>`, 'error');
            }
        }

        async function checkParticipants() {
            try {
                const currentRoundId = await contract.currentRoundId();
                if (currentRoundId.eq(0)) return;

                const participants = await contract.getRoundParticipants(currentRoundId);
                if (participants.length === 0) return;

                const participantDetails = await Promise.all(
                    participants.map(async (addr) => {
                        const tickets = await contract.getParticipantTickets(currentRoundId, addr);
                        return { address: addr, tickets: tickets.toString() };
                    })
                );

                const totalTickets = participantDetails.reduce((sum, p) => sum + parseInt(p.tickets), 0);
                const participantsList = participantDetails.map((p, i) => {
                    const pct = ((parseInt(p.tickets) / totalTickets) * 100).toFixed(2);
                    return `<div class="participant-item"><strong>${i + 1}. ${p.address}</strong><br>Tickets: ${p.tickets} (${pct}%)</div>`;
                }).join('');

                const content = `
                    <div class="info-row"><span class="info-label">Total:</span><span class="info-value">${participants.length}</span></div>
                    <div style="margin-top: 15px;"><strong>Details:</strong><div class="participants-list">${participantsList}</div></div>
                `;
                addSection('Participants', content, 'good');
            } catch (error) {
                addSection('Participants', `<div class="error-box">Error: ${error.message}</div>`, 'error');
            }
        }

        async function checkContractBalance() {
            try {
                const balance = await provider.getBalance(CONFIG.contractAddress);
                const balanceBNB = ethers.utils.formatEther(balance);
                const content = `
                    <div class="info-row"><span class="info-label">BNB Balance:</span><span class="info-value">${balanceBNB} BNB</span></div>
                    <div class="info-row"><span class="info-label">BscScan:</span><span class="info-value"><a href="https://testnet.bscscan.com/address/${CONFIG.contractAddress}" target="_blank" style="color: #00d4ff;">View</a></span></div>
                `;
                addSection('Contract Balance', content, 'good');
            } catch (error) {
                addSection('Balance', `<div class="error-box">Error: ${error.message}</div>`, 'error');
            }
        }

        async function checkVRFSetup() {
            clearResults();
            addLoading('Checking VRF...');
            if (!await init()) return;
            try {
                await checkVRFConfiguration();
                document.querySelector('.loading')?.remove();
            } catch (error) {
                document.querySelector('.loading')?.remove();
                addSection('VRF Error', `<div class="error-box">Error: ${error.message}</div>`, 'error');
            }
        }

        async function testCloseRound() {
            clearResults();
            addLoading('Testing closeRound...');
            try {
                if (typeof window.ethereum === 'undefined') {
                    addSection('Wallet Error', '<div class="error-box">No wallet detected!</div>', 'error');
                    return;
                }

                const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                await web3Provider.send("eth_requestAccounts", []);
                const signer = web3Provider.getSigner();
                const address = await signer.getAddress();
                addSection('Wallet', `<div class="success-box">✅ Connected: ${address}</div>`, 'good');

                const contractWithSigner = new ethers.Contract(CONFIG.contractAddress, CONTRACT_ABI, signer);

                try {
                    const [canClose, reason] = await contractWithSigner.canCloseRound();
                    if (!canClose) {
                        addSection('Not Ready', `<div class="error-box">❌ ${reason}</div>`, 'error');
                        document.querySelector('.loading')?.remove();
                        return;
                    }
                } catch (e) {
                    addSection('Warning', `<div class="warning-box">⚠️ ${e.message}<br>Trying anyway...</div>`, 'warning');
                }

                addSection('Sending', '<div class="loading">📤 Sending transaction...</div>');
                const tx = await contractWithSigner.closeRound();
                addSection('Sent', `<div class="success-box">✅ Sent: ${tx.hash}<br><a href="https://testnet.bscscan.com/tx/${tx.hash}" target="_blank" style="color: #00d4ff;">View</a></div>`, 'good');

                addSection('Confirming', '<div class="loading">⏳ Waiting...</div>');
                const receipt = await tx.wait();
                addSection('Confirmed', `<div class="success-box">🎉 Block: ${receipt.blockNumber}<br>Gas: ${receipt.gasUsed}</div>`, 'good');
                document.querySelector('.loading')?.remove();
            } catch (error) {
                document.querySelector('.loading')?.remove();
                let errorMessage = error.message;
                if (error.error && error.error.message) errorMessage = error.error.message;
                addSection('Failed', `<div class="error-box">❌ ${errorMessage}<br><pre>${error.stack}</pre></div>`, 'error');
            }
        }
    </script>
</body>
</html>
