<!DOCTYPE html>
<html>
<head>
    <title>Quick Round Status Check</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .status { padding: 15px; background: #2a2a2a; margin: 10px 0; border-radius: 5px; }
        .error { color: #ff4444; }
        .success { color: #00ff00; }
        .warning { color: #ffaa00; }
        button {
            padding: 10px 20px;
            background: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover { background: #00cc00; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Blue Raffle Round Status - Quick Check</h1>
    <button onclick="checkStatus()">Check Round Status</button>
    <button onclick="checkCanClose()">Check Can Close</button>
    <button onclick="tryCloseAsOwner()">Try Close As Owner</button>
    <div id="results"></div>

    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <script>
        const CONFIG = {
            contractAddress: '0x989092ff3b648df57d54b4a4118f396c8815221e',
            blueTokenAddress: '0xf11Af396703E11D48780B5154E52Fd7b430C6C01',
            ownerWallet: '0x5F55f9bBaBe64c4b9070655DEC8DB6519EbdDBf2',
            rpcUrl: 'https://data-seed-prebsc-1-s1.binance.org:8545/',
            chainId: 97
        };

        const CONTRACT_ABI = [
            "function currentRoundId() view returns (uint256)",
            "function paused() view returns (bool)",
            "function owner() view returns (address)",
            "function minParticipants() view returns (uint256)",
            "function roundDuration() view returns (uint256)",
            "function rounds(uint256) view returns (uint256 totalPot, uint256 prizePool, uint256 uniqueWallets, uint256 totalTickets, uint256 startTime, uint256 endTime, uint8 status, address winner)",
            "function canCloseRound() view returns (bool, string memory)",
            "function closeRound()",
            "function getRoundParticipants(uint256) view returns (address[] memory)",
            "function getParticipantTickets(uint256, address) view returns (uint256)",
            "function getDiagnostics() view returns (uint256, uint8, uint256, uint256, uint256, uint256, uint256, bool, address, uint256, uint256)"
        ];

        const STATUS_NAMES = ['Pending', 'Active', 'WaitingVRF', 'Completed'];

        let provider, contract;

        async function init() {
            try {
                provider = new ethers.providers.JsonRpcProvider(CONFIG.rpcUrl);
                contract = new ethers.Contract(CONFIG.contractAddress, CONTRACT_ABI, provider);
                return true;
            } catch (error) {
                log('❌ Failed to initialize: ' + error.message, 'error');
                return false;
            }
        }

        function log(message, type = 'status') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = message;
            document.getElementById('results').appendChild(div);
        }

        async function checkStatus() {
            document.getElementById('results').innerHTML = '<div class="status">🔄 Checking...</div>';

            if (!await init()) return;

            try {
                const [
                    currentRoundId,
                    isPaused,
                    owner,
                    minParticipants,
                    roundDuration
                ] = await Promise.all([
                    contract.currentRoundId(),
                    contract.paused(),
                    contract.owner(),
                    contract.minParticipants(),
                    contract.roundDuration()
                ]);

                log('<h3>📊 Contract Status</h3>', 'success');
                log(`<pre>Contract: ${CONFIG.contractAddress}\nOwner: ${owner}\nPaused: ${isPaused}\nMin Participants: ${minParticipants}\nRound Duration: ${roundDuration}s (${Math.floor(roundDuration/60)} minutes)</pre>`);

                if (currentRoundId.eq(0)) {
                    log('❌ No rounds exist yet!', 'error');
                    return;
                }

                const round = await contract.rounds(currentRoundId);
                const now = Math.floor(Date.now() / 1000);
                const timeLeft = round.endTime.toNumber() - now;

                log('<h3>🎰 Current Round #' + currentRoundId + '</h3>', 'success');
                log(`<pre>Status: ${STATUS_NAMES[round.status]} (${round.status})\nTotal Pot: ${ethers.utils.formatEther(round.totalPot)} BLUE\nPrize Pool: ${ethers.utils.formatEther(round.prizePool)} BLUE\nParticipants: ${round.uniqueWallets}\nTotal Tickets: ${round.totalTickets}\nStart Time: ${new Date(round.startTime * 1000).toLocaleString()}\nEnd Time: ${new Date(round.endTime * 1000).toLocaleString()}\nTime Left: ${timeLeft > 0 ? timeLeft + 's' : 'EXPIRED'}\nWinner: ${round.winner}</pre>`);

                // Check specific conditions
                log('<h3>🔍 Close Conditions Check</h3>', 'warning');

                const checks = [];
                checks.push(`Round exists: ✅ (ID: ${currentRoundId})`);
                checks.push(`Contract paused: ${isPaused ? '❌ YES - MUST UNPAUSE!' : '✅ No'}`);
                checks.push(`Round status: ${round.status === 1 ? '✅ Active' : `❌ ${STATUS_NAMES[round.status]} (needs to be Active)`}`);
                checks.push(`Time expired: ${timeLeft <= 0 ? '✅ Yes' : `❌ No (${timeLeft}s remaining)`}`);
                checks.push(`Enough participants: ${round.uniqueWallets >= minParticipants ? '✅ Yes' : `❌ No (${round.uniqueWallets}/${minParticipants})`}`);

                log('<pre>' + checks.join('\n') + '</pre>');

                // Get participants
                const participants = await contract.getRoundParticipants(currentRoundId);
                log('<h3>👥 Participants</h3>', 'success');
                for (let i = 0; i < participants.length; i++) {
                    const addr = participants[i];
                    const tickets = await contract.getParticipantTickets(currentRoundId, addr);
                    log(`<pre>${i+1}. ${addr}: ${tickets} tickets</pre>`);
                }

            } catch (error) {
                log('❌ Error: ' + error.message, 'error');
                console.error(error);
            }
        }

        async function checkCanClose() {
            document.getElementById('results').innerHTML = '<div class="status">🔄 Checking if round can close...</div>';

            if (!await init()) return;

            try {
                const [canClose, reason] = await contract.canCloseRound();

                if (canClose) {
                    log('✅ Round CAN be closed!', 'success');
                } else {
                    log('❌ Round CANNOT be closed', 'error');
                    log('Reason: ' + reason, 'error');
                }

                // Also get diagnostics
                const diag = await contract.getDiagnostics();
                log('<h3>📋 Full Diagnostics</h3>', 'success');
                log(`<pre>Current Round ID: ${diag[0]}\nRound Status: ${STATUS_NAMES[diag[1]]} (${diag[1]})\nParticipants: ${diag[2]}\nTotal Tickets: ${diag[3]}\nStart Time: ${new Date(diag[4] * 1000).toLocaleString()}\nEnd Time: ${new Date(diag[5] * 1000).toLocaleString()}\nMin Participants: ${diag[6]}\nIs Paused: ${diag[7]}\nOwner: ${diag[8]}\nRound Duration: ${diag[9]}s\nCurrent Time: ${new Date(diag[10] * 1000).toLocaleString()}</pre>`);

            } catch (error) {
                log('❌ Error calling canCloseRound: ' + error.message, 'error');
                log('This might mean the function doesn\'t exist or contract is incompatible', 'warning');
                console.error(error);
            }
        }

        async function tryCloseAsOwner() {
            log('⚠️ This requires connecting your wallet as owner', 'warning');
            log('Attempting to connect...', 'status');

            try {
                if (typeof window.ethereum === 'undefined') {
                    log('❌ No wallet detected! Please install Rabby/MetaMask', 'error');
                    return;
                }

                const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                await web3Provider.send("eth_requestAccounts", []);
                const signer = web3Provider.getSigner();
                const address = await signer.getAddress();

                log(`✅ Connected: ${address}`, 'success');

                const contractWithSigner = new ethers.Contract(CONFIG.contractAddress, CONTRACT_ABI, signer);

                // Check if can close first
                try {
                    const [canClose, reason] = await contractWithSigner.canCloseRound();
                    if (!canClose) {
                        log(`❌ Cannot close round: ${reason}`, 'error');
                        return;
                    }
                } catch (e) {
                    log('⚠️ Could not check canCloseRound, attempting anyway...', 'warning');
                }

                log('📤 Sending closeRound transaction...', 'status');
                const tx = await contractWithSigner.closeRound();
                log(`✅ Transaction sent: ${tx.hash}`, 'success');
                log('⏳ Waiting for confirmation...', 'status');

                const receipt = await tx.wait();
                log(`✅ Transaction confirmed! Block: ${receipt.blockNumber}`, 'success');
                log(`🔗 View on BscScan: https://testnet.bscscan.com/tx/${tx.hash}`, 'success');

            } catch (error) {
                log('❌ Transaction failed: ' + error.message, 'error');
                if (error.data) {
                    log('Error data: ' + error.data, 'error');
                }
                console.error(error);
            }
        }

        // Auto-check on load
        window.onload = () => {
            setTimeout(checkStatus, 500);
        };
    </script>
</body>
</html>
