<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Raffle - Full Diagnostics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #00ff88;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff88;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .section h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }
        .info-label {
            font-weight: bold;
            color: #00d4ff;
        }
        .info-value {
            color: #00ff88;
            text-align: right;
        }
        .status-good {
            color: #00ff88;
            font-weight: bold;
        }
        .status-warning {
            color: #ffaa00;
            font-weight: bold;
        }
        .status-error {
            color: #ff4444;
            font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.5);
        }
        button:active {
            transform: translateY(0);
        }
        .button-group {
            text-align: center;
            margin: 20px 0;
        }
        .loading {
            text-align: center;
            font-size: 1.5em;
            color: #00d4ff;
            margin: 20px 0;
        }
        .error-box {
            background: rgba(255, 68, 68, 0.2);
            border: 2px solid #ff4444;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            color: #ff4444;
        }
        .success-box {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            color: #00ff88;
        }
        .warning-box {
            background: rgba(255, 170, 0, 0.2);
            border: 2px solid #ffaa00;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            color: #ffaa00;
        }
        .participants-list {
            margin-top: 10px;
        }
        .participant-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 3px solid #00d4ff;
        }
        .checklist {
            margin-top: 10px;
        }
        .checklist-item {
            padding: 8px;
            margin: 5px 0;
            border-radius: 3px;
        }
        .check-pass {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
        }
        .check-fail {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
        }
        .check-warning {
            background: rgba(255, 170, 0, 0.1);
            color: #ffaa00;
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            color: #00ff88;
            font-size: 0.9em;
        }
        .timestamp {
            text-align: center;
            color: #888;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .countdown {
            font-size: 2em;
            text-align: center;
            margin: 20px 0;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Blue Raffle - Full System Diagnostics</h1>

        <div class="button-group">
            <button onclick="runFullDiagnostics()">🔍 Run Full Diagnostics</button>
            <button onclick="checkVRFSetup()">🔗 Check VRF Setup</button>
            <button onclick="testCloseRound()">🎲 Test Close Round</button>
        </div>

        <div id="results"></div>
        <div class="timestamp" id="timestamp"></div>
    </div>

    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <script>
        const CONFIG = {
            contractAddress: '0x989092ff3b648df57d54b4a4118f396c8815221e',
            blueTokenAddress: '0xf11Af396703E11D48780B5154E52Fd7b430C6C01',
            vrfCoordinator: '0xDA3b641D438362C440Ac5458c57e00a712b66700',
            subscriptionId: '26655927599451290729520880429262733726305991805472180956508373717196718435172',
            keyHash: '0x8596b430971ac45bdf6088665b9ad8e8630c9d5049ab54b14dff711bee7c0e26',
            rpcUrl: 'https://data-seed-prebsc-1-s1.binance.org:8545/',
            bscscanApi: 'https://api-testnet.bscscan.com/api',
            chainId: 97
        };

        const CONTRACT_ABI = [
            "function currentRoundId() view returns (uint256)",
            "function paused() view returns (bool)",
            "function owner() view returns (address)",
            "function minParticipants() view returns (uint256)",
            "function roundDuration() view returns (uint256)",
            "function rounds(uint256) view returns (uint256 totalPot, uint256 prizePool, uint256 uniqueWallets, uint256 totalTickets, uint256 startTime, uint256 endTime, uint8 status, address winner)",
            "function canCloseRound() view returns (bool, string memory)",
            "function closeRound()",
            "function getRoundParticipants(uint256) view returns (address[] memory)",
            "function getParticipantTickets(uint256, address) view returns (uint256)",
            "function getDiagnostics() view returns (uint256, uint8, uint256, uint256, uint256, uint256, uint256, bool, address, uint256, uint256)",
            "function s_vrfCoordinator() view returns (address)",
            "function s_subscriptionId() view returns (uint64)",
            "function s_gasLane() view returns (bytes32)",
            "function s_callbackGasLimit() view returns (uint32)",
            "function blueToken() view returns (address)",
            "function treasuryWallet() view returns (address)",
            "function developerWallet() view returns (address)"
        ];

        const VRF_ABI = [
            "function getSubscription(uint64 subId) view returns (uint96 balance, uint64 reqCount, address owner, address[] memory consumers)"
        ];

        const STATUS_NAMES = ['Pending', 'Active', 'WaitingVRF', 'Completed'];

        let provider, contract, vrfContract;

        function updateTimestamp() {
            document.getElementById('timestamp').textContent =
                'Last updated: ' + new Date().toLocaleString();
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            updateTimestamp();
        }

        function addSection(title, content, status = '') {
            const section = document.createElement('div');
            section.className = 'section';

            let statusIcon = '';
            if (status === 'good') statusIcon = '✅';
            else if (status === 'warning') statusIcon = '⚠️';
            else if (status === 'error') statusIcon = '❌';

            section.innerHTML = `<h2>${statusIcon} ${title}</h2>${content}`;
            document.getElementById('results').appendChild(section);
        }

        function addLoading(message) {
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = `🔄 ${message}`;
            document.getElementById('results').appendChild(loading);
        }

        async function init() {
            try {
                provider = new ethers.providers.JsonRpcProvider(CONFIG.rpcUrl);
                contract = new ethers.Contract(CONFIG.contractAddress, CONTRACT_ABI, provider);
                vrfContract = new ethers.Contract(CONFIG.vrfCoordinator, VRF_ABI, provider);
                return true;
            } catch (error) {
                addSection('Initialization Error',
                    `<div class="error-box">Failed to initialize: ${error.message}</div>`,
                    'error');
                return false;
            }
        }

        async function runFullDiagnostics() {
            clearResults();
            addLoading('Running comprehensive diagnostics...');

            if (!await init()) return;

            try {
                // 1. Contract Configuration
                await checkContractConfiguration();

                // 2. Current Round Status
                await checkCurrentRound();

                // 3. VRF Configuration
                await checkVRFConfiguration();

                // 4. Close Round Readiness
                await checkCloseRoundReadiness();

                // 5. Participants
                await checkParticipants();

                // 6. Contract Balance
                await checkContractBalance();

                document.querySelector('.loading')?.remove();

            } catch (error) {
                document.querySelector('.loading')?.remove();
                addSection('Diagnostic Error',
                    `<div class="error-box">Error running diagnostics: ${error.message}<br><pre>${error.stack}</pre></div>`,
                    'error');
            }
        }

        async function checkContractConfiguration() {
            try {
                const [
                    owner,
                    paused,
                    minParticipants,
                    roundDuration,
                    blueToken,
                    treasuryWallet,
                    developerWallet
                ] = await Promise.all([
                    contract.owner(),
                    contract.paused(),
                    contract.minParticipants(),
                    contract.roundDuration(),
                    contract.blueToken(),
                    contract.treasuryWallet(),
                    contract.developerWallet()
                ]);

                let status = 'good';
                let issues = [];

                if (paused) {
                    status = 'error';
                    issues.push('<div class="error-box">⚠️ CONTRACT IS PAUSED - Must unpause before closing rounds!</div>');
                }

                if (blueToken.toLowerCase() !== CONFIG.blueTokenAddress.toLowerCase()) {
                    status = 'warning';
                    issues.push('<div class="warning-box">⚠️ BLUE token address mismatch!</div>');
                }

                const content = `
                    ${issues.join('')}
                    <div class="info-row">
                        <span class="info-label">Contract Address:</span>
                        <span class="info-value">${CONFIG.contractAddress}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Owner:</span>
                        <span class="info-value">${owner}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Paused:</span>
                        <span class="info-value ${paused ? 'status-error' : 'status-good'}">${paused ? 'YES ❌' : 'NO ✅'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Min Participants:</span>
                        <span class="info-value">${minParticipants.toString()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Round Duration:</span>
                        <span class="info-value">${roundDuration.toString()}s (${Math.floor(roundDuration / 60)} minutes)</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">BLUE Token:</span>
                        <span class="info-value">${blueToken}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Treasury Wallet:</span>
                        <span class="info-value">${treasuryWallet}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Developer Wallet:</span>
                        <span class="info-value">${developerWallet}</span>
                    </div>
                `;

                addSection('Contract Configuration', content, status);
            } catch (error) {
                addSection('Contract Configuration',
                    `<div class="error-box">Error: ${error.message}</div>`,
                    'error');
            }
        }

        async function checkCurrentRound() {
            try {
                const currentRoundId = await contract.currentRoundId();

                if (currentRoundId.eq(0)) {
                    addSection('Current Round',
                        '<div class="warning-box">No rounds exist yet. Start the first round from admin panel.</div>',
                        'warning');
                    return;
                }

                const round = await contract.rounds(currentRoundId);
                const now = Math.floor(Date.now() / 1000);
                const timeLeft = round.endTime.toNumber() - now;
                const timeSinceStart = now - round.startTime.toNumber();

                let statusClass = 'good';
                let statusText = STATUS_NAMES[round.status];

                if (round.status === 0) {
                    statusClass = 'warning';
                    statusText += ' ⚠️ (Needs to be Active)';
                } else if (round.status === 1 && timeLeft <= 0) {
                    statusClass = 'good';
                    statusText += ' ✅ (Ready to close!)';
                } else if (round.status === 2) {
                    statusClass = 'warning';
                    statusText += ' ⏳ (Waiting for VRF response)';
                } else if (round.status === 3) {
                    statusClass = 'good';
                    statusText += ' ✅ (Completed)';
                }

                let timerDisplay = '';
                if (round.status === 1) {
                    if (timeLeft > 0) {
                        const minutes = Math.floor(timeLeft / 60);
                        const seconds = timeLeft % 60;
                        timerDisplay = `<div class="countdown">⏰ Time Remaining: ${minutes}:${seconds.toString().padStart(2, '0')}</div>`;
                    } else {
                        timerDisplay = `<div class="countdown status-good">⏰ ROUND EXPIRED - READY TO CLOSE!</div>`;
                    }
                }

                const content = `
                    ${timerDisplay}
                    <div class="info-row">
                        <span class="info-label">Round ID:</span>
                        <span class="info-value">${currentRoundId.toString()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Status:</span>
                        <span class="info-value status-${statusClass}">${statusText}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Total Pot:</span>
                        <span class="info-value">${ethers.utils.formatEther(round.totalPot)} BLUE</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Prize Pool:</span>
                        <span class="info-value">${ethers.utils.formatEther(round.prizePool)} BLUE</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Unique Wallets:</span>
                        <span class="info-value">${round.uniqueWallets.toString()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Total Tickets:</span>
                        <span class="info-value">${round.totalTickets.toString()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Start Time:</span>
                        <span class="info-value">${new Date(round.startTime * 1000).toLocaleString()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">End Time:</span>
                        <span class="info-value">${new Date(round.endTime * 1000).toLocaleString()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Time Since Start:</span>
                        <span class="info-value">${Math.floor(timeSinceStart / 60)} minutes ${timeSinceStart % 60} seconds</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Time ${timeLeft > 0 ? 'Remaining' : 'Overdue'}:</span>
                        <span class="info-value ${timeLeft <= 0 ? 'status-good' : ''}">${timeLeft > 0 ? Math.floor(timeLeft / 60) + ' minutes ' + (timeLeft % 60) + ' seconds' : 'EXPIRED ✅'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Winner:</span>
                        <span class="info-value">${round.winner === ethers.constants.AddressZero ? 'None yet' : round.winner}</span>
                    </div>
                `;

                addSection('Current Round Status', content, statusClass);
            } catch (error) {
                addSection('Current Round Status',
                    `<div class="error-box">Error: ${error.message}</div>`,
                    'error');
            }
        }

        async function checkVRFConfiguration() {
            try {
                const [
                    vrfCoordinator,
                    subscriptionId,
                    keyHash,
                    callbackGasLimit
                ] = await Promise.all([
                    contract.s_vrfCoordinator(),
                    contract.s_subscriptionId(),
                    contract.s_gasLane(),
                    contract.s_callbackGasLimit()
                ]);

                let status = 'good';
                let issues = [];

                if (vrfCoordinator.toLowerCase() !== CONFIG.vrfCoordinator.toLowerCase()) {
                    status = 'error';
                    issues.push(`<div class="error-box">❌ VRF Coordinator mismatch!<br>Contract: ${vrfCoordinator}<br>Expected: ${CONFIG.vrfCoordinator}</div>`);
                }

                if (keyHash.toLowerCase() !== CONFIG.keyHash.toLowerCase()) {
                    status = 'error';
                    issues.push(`<div class="error-box">❌ Key Hash mismatch!<br>Contract: ${keyHash}<br>Expected: ${CONFIG.keyHash}</div>`);
                }

                const subIdBigNumber = ethers.BigNumber.from(CONFIG.subscriptionId);
                if (!subscriptionId.eq(subIdBigNumber)) {
                    status = 'error';
                    issues.push(`<div class="error-box">❌ Subscription ID mismatch!<br>Contract: ${subscriptionId.toString()}<br>Expected: ${CONFIG.subscriptionId}</div>`);
                }

                const content = `
                    ${issues.join('')}
                    ${issues.length === 0 ? '<div class="success-box">✅ All VRF parameters match expected values!</div>' : ''}
                    <div class="info-row">
                        <span class="info-label">VRF Coordinator:</span>
                        <span class="info-value">${vrfCoordinator}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Subscription ID:</span>
                        <span class="info-value">${subscriptionId.toString()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Key Hash:</span>
                        <span class="info-value">${keyHash}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Callback Gas Limit:</span>
                        <span class="info-value">${callbackGasLimit.toString()}</span>
                    </div>
                `;

                addSection('VRF Configuration', content, status);

                // Check VRF subscription details
                await checkVRFSubscription(subscriptionId);

            } catch (error) {
                addSection('VRF Configuration',
                    `<div class="error-box">Error: ${error.message}</div>`,
                    'error');
            }
        }

        async function checkVRFSubscription(subscriptionId) {
            try {
                const subscription = await vrfContract.getSubscription(subscriptionId);
                const linkBalance = ethers.utils.formatEther(subscription.balance);
                const consumers = subscription.consumers;

                let status = 'good';
                let issues = [];

                if (parseFloat(linkBalance) < 0.1) {
                    status = 'error';
                    issues.push('<div class="error-box">❌ Low LINK balance! Add more LINK to subscription.</div>');
                } else if (parseFloat(linkBalance) < 0.5) {
                    status = 'warning';
                    issues.push('<div class="warning-box">⚠️ LINK balance is low. Consider adding more.</div>');
                }

                const isConsumer = consumers.some(c => c.toLowerCase() === CONFIG.contractAddress.toLowerCase());
                if (!isConsumer) {
                    status = 'error';
                    issues.push('<div class="error-box">❌ Contract is NOT registered as consumer! This will cause closeRound() to fail!</div>');
                }

                const consumersList = consumers.map((c, i) =>
                    `<div class="participant-item">${i + 1}. ${c} ${c.toLowerCase() === CONFIG.contractAddress.toLowerCase() ? '✅ (This contract)' : ''}</div>`
                ).join('');

                const content = `
                    ${issues.join('')}
                    ${issues.length === 0 ? '<div class="success-box">✅ VRF Subscription is properly configured!</div>' : ''}
                    <div class="info-row">
                        <span class="info-label">LINK Balance:</span>
                        <span class="info-value ${parseFloat(linkBalance) < 0.5 ? 'status-warning' : 'status-good'}">${linkBalance} LINK</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Request Count:</span>
                        <span class="info-value">${subscription.reqCount.toString()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Owner:</span>
                        <span class="info-value">${subscription.owner}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Is Contract a Consumer:</span>
                        <span class="info-value ${isConsumer ? 'status-good' : 'status-error'}">${isConsumer ? 'YES ✅' : 'NO ❌'}</span>
                    </div>
                    <div style="margin-top: 15px;">
                        <strong>Registered Consumers:</strong>
                        <div class="participants-list">${consumersList}</div>
                    </div>
                `;

                addSection('VRF Subscription Details', content, status);

            } catch (error) {
                addSection('VRF Subscription Details',
                    `<div class="error-box">Error checking VRF subscription: ${error.message}<br>This could mean the subscription doesn't exist or is on the wrong network.</div>`,
                    'error');
            }
        }

        async function checkCloseRoundReadiness() {
            try {
                const currentRoundId = await contract.currentRoundId();

                if (currentRoundId.eq(0)) {
                    addSection('Close Round Readiness',
                        '<div class="warning-box">No rounds exist yet.</div>',
                        'warning');
                    return;
                }

                const [
                    canCloseResult,
                    paused,
                    minParticipants,
                    round
                ] = await Promise.all([
                    contract.canCloseRound().catch(() => [false, "canCloseRound function not available"]),
                    contract.paused(),
                    contract.minParticipants(),
                    contract.rounds(currentRoundId)
                ]);

                const now = Math.floor(Date.now() / 1000);
                const timeLeft = round.endTime.toNumber() - now;

                const checks = [];
                let allPass = true;

                // Check 1: Contract not paused
                if (!paused) {
                    checks.push('<div class="checklist-item check-pass">✅ Contract is not paused</div>');
                } else {
                    checks.push('<div class="checklist-item check-fail">❌ Contract is PAUSED - must unpause first</div>');
                    allPass = false;
                }

                // Check 2: Round is Active
                if (round.status === 1) {
                    checks.push('<div class="checklist-item check-pass">✅ Round is in Active status</div>');
                } else {
                    checks.push(`<div class="checklist-item check-fail">❌ Round is in ${STATUS_NAMES[round.status]} status (must be Active)</div>`);
                    allPass = false;
                }

                // Check 3: Time expired
                if (timeLeft <= 0) {
                    checks.push('<div class="checklist-item check-pass">✅ Round timer has expired</div>');
                } else {
                    checks.push(`<div class="checklist-item check-fail">❌ Round timer has NOT expired (${timeLeft}s remaining)</div>`);
                    allPass = false;
                }

                // Check 4: Enough participants
                if (round.uniqueWallets >= minParticipants) {
                    checks.push(`<div class="checklist-item check-pass">✅ Enough participants (${round.uniqueWallets}/${minParticipants})</div>`);
                } else {
                    checks.push(`<div class="checklist-item check-fail">❌ Not enough participants (${round.uniqueWallets}/${minParticipants})</div>`);
                    allPass = false;
                }

                // Check 5: canCloseRound result
                if (canCloseResult[0]) {
                    checks.push('<div class="checklist-item check-pass">✅ Contract reports: Ready to close</div>');
                } else {
                    checks.push(`<div class="checklist-item check-fail">❌ Contract reports: ${canCloseResult[1]}</div>`);
                    allPass = false;
                }

                const status = allPass ? 'good' : 'error';
                const summary = allPass
                    ? '<div class="success-box">🎉 ALL CHECKS PASSED - Round is ready to close!</div>'
                    : '<div class="error-box">⚠️ Some checks failed - fix issues before closing round</div>';

                const content = `
                    ${summary}
                    <div class="checklist">
                        ${checks.join('')}
                    </div>
                `;

                addSection('Close Round Readiness', content, status);

            } catch (error) {
                addSection('Close Round Readiness',
                    `<div class="error-box">Error: ${error.message}</div>`,
                    'error');
            }
        }

        async function checkParticipants() {
            try {
                const currentRoundId = await contract.currentRoundId();

                if (currentRoundId.eq(0)) {
                    return;
                }

                const participants = await contract.getRoundParticipants(currentRoundId);

                if (participants.length === 0) {
                    addSection('Participants',
                        '<div class="warning-box">No participants in this round yet.</div>',
                        'warning');
                    return;
                }

                const participantDetails = await Promise.all(
                    participants.map(async (addr, i) => {
                        const tickets = await contract.getParticipantTickets(currentRoundId, addr);
                        return { address: addr, tickets: tickets.toString() };
                    })
                );

                const totalTickets = participantDetails.reduce((sum, p) => sum + parseInt(p.tickets), 0);

                const participantsList = participantDetails.map((p, i) => {
                    const percentage = ((parseInt(p.tickets) / totalTickets) * 100).toFixed(2);
                    return `
                        <div class="participant-item">
                            <strong>${i + 1}. ${p.address}</strong><br>
                            Tickets: ${p.tickets} (${percentage}% chance to win)
                        </div>
                    `;
                }).join('');

                const content = `
                    <div class="info-row">
                        <span class="info-label">Total Participants:</span>
                        <span class="info-value">${participants.length}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Total Tickets:</span>
                        <span class="info-value">${totalTickets}</span>
                    </div>
                    <div style="margin-top: 15px;">
                        <strong>Participant Details:</strong>
                        <div class="participants-list">${participantsList}</div>
                    </div>
                `;

                addSection('Participants', content, 'good');

            } catch (error) {
                addSection('Participants',
                    `<div class="error-box">Error: ${error.message}</div>`,
                    'error');
            }
        }

        async function checkContractBalance() {
            try {
                const balance = await provider.getBalance(CONFIG.contractAddress);
                const balanceBNB = ethers.utils.formatEther(balance);

                let status = 'good';
                let message = '';

                if (parseFloat(balanceBNB) === 0) {
                    status = 'warning';
                    message = '<div class="warning-box">Contract has 0 BNB. This is normal if it only handles BLUE tokens.</div>';
                }

                const content = `
                    ${message}
                    <div class="info-row">
                        <span class="info-label">Contract BNB Balance:</span>
                        <span class="info-value">${balanceBNB} BNB</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">View on BscScan:</span>
                        <span class="info-value"><a href="https://testnet.bscscan.com/address/${CONFIG.contractAddress}" target="_blank" style="color: #00d4ff;">Open BscScan</a></span>
                    </div>
                `;

                addSection('Contract Balance', content, status);

            } catch (error) {
                addSection('Contract Balance',
                    `<div class="error-box">Error: ${error.message}</div>`,
                    'error');
            }
        }

        async function checkVRFSetup() {
            clearResults();
            addLoading('Checking VRF setup...');

            if (!await init()) return;

            try {
                await checkVRFConfiguration();
                document.querySelector('.loading')?.remove();
            } catch (error) {
                document.querySelector('.loading')?.remove();
                addSection('VRF Check Error',
                    `<div class="error-box">Error: ${error.message}</div>`,
                    'error');
            }
        }

        async function testCloseRound() {
            clearResults();
            addLoading('Testing closeRound transaction...');

            try {
                if (typeof window.ethereum === 'undefined') {
                    addSection('Wallet Error',
                        '<div class="error-box">No wallet detected! Please install Rabby or MetaMask.</div>',
                        'error');
                    return;
                }

                const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                await web3Provider.send("eth_requestAccounts", []);
                const signer = web3Provider.getSigner();
                const address = await signer.getAddress();

                addSection('Wallet Connected',
                    `<div class="success-box">✅ Connected as: ${address}</div>`,
                    'good');

                const contractWithSigner = new ethers.Contract(CONFIG.contractAddress, CONTRACT_ABI, signer);

                // First check if ready
                try {
                    const [canClose, reason] = await contractWithSigner.canCloseRound();
                    if (!canClose) {
                        addSection('Not Ready',
                            `<div class="error-box">❌ Round cannot be closed yet:<br>${reason}</div>`,
                            'error');
                        document.querySelector('.loading')?.remove();
                        return;
                    }
                } catch (e) {
                    addSection('Check Warning',
                        `<div class="warning-box">⚠️ Could not verify readiness: ${e.message}<br>Attempting closeRound anyway...</div>`,
                        'warning');
                }

                addSection('Sending Transaction',
                    '<div class="loading">📤 Sending closeRound transaction...</div>');

                const tx = await contractWithSigner.closeRound();

                addSection('Transaction Sent',
                    `<div class="success-box">✅ Transaction sent!<br>Hash: ${tx.hash}<br><a href="https://testnet.bscscan.com/tx/${tx.hash}" target="_blank" style="color: #00d4ff;">View on BscScan</a></div>`,
                    'good');

                addSection('Waiting for Confirmation',
                    '<div class="loading">⏳ Waiting for confirmation...</div>');

                const receipt = await tx.wait();

                addSection('Transaction Confirmed',
                    `<div class="success-box">🎉 Transaction confirmed!<br>Block: ${receipt.blockNumber}<br>Gas used: ${receipt.gasUsed.toString()}</div>`,
                    'good');

                document.querySelector('.loading')?.remove();

            } catch (error) {
                document.querySelector('.loading')?.remove();

                let errorMessage = error.message;
                let errorData = '';

                if (error.data) {
                    errorData = `<br><strong>Error Data:</strong> ${error.data}`;
                }

                if (error.error && error.error.message) {
                    errorMessage = error.error.message;
                }

                addSection('Transaction Failed',
                    `<div class="error-box">❌ Transaction failed:<br>${errorMessage}${errorData}<br><br><pre>${error.stack}</pre></div>`,
                    'error');
            }
        }

        // Auto-run diagnostics on page load
        window.addEventListener('load', () => {
            setTimeout(runFullDiagnostics, 500);
        });
    </script>
</body>
</html>
